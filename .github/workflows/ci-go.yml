name: CI-Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # FR-GO-14: windows-only files (internal/platform/listener_windows.go and
  # its test) are excluded from the unix build, so nothing above proves they
  # compile. Cross-compile + vet with GOOS=windows: vet type-checks the
  # windows test files too, which plain build does not.
  windows-cross:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...

  # Real windows runner, build-only (no go test): the platform package skips
  # its round-trip tests there until the FR-CTRL pipe listener lands —
  # recorded justification in docs/WINDOWS.md. Keeps CI minutes sane per
  # FR-GO-14.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  # Issues #205/#250 single-implementation gate: the Go CLI is the only
  # implementation. Fails CI when any Node-era artifact or Node toolchain
  # invocation reappears. The pattern literals below are written so this
  # file never matches its own checks.
  single-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Single-implementation gate (Go only, issue #205)
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          # Node-era artifacts must not exist.
          for path in src test package.json package-lock.json tsconfig.json dist; do
            [ ! -e "$path" ] || fail "Node remnant '$path' exists — the Go CLI is the only implementation (issue #205)"
          done

          # Workflows must not invoke the Node toolchain (npm/npx/tsx/node).
          # Exception: app-build.yml drives the Tauri 2 webview UI (#181,
          # FR-UI-01..09) — the Go single-implementation rule covers the
          # DevAgent core; the app's UI stack is TS by the §20.4 decision.
          if grep -rnE '(npm|npx|tsx|node) ' .github/workflows/*.yml \
              | grep -v '^\.github/workflows/app-build\.yml:'; then
            fail "Node toolchain invocation found in .github/workflows — CI runs the Go suite only (issues #205, #250)"
          fi

          # Version tooling is Go-only (issue #250): no .mjs/.cjs scripts may
          # exist under .github or scripts/release — the semver tool lives at
          # scripts/release/nextversion (Go main package).
          if find .github scripts/release -type f \( -name '*.mjs' -o -name '*.cjs' \) | grep -q .; then
            fail ".mjs/.cjs script found under .github/ or scripts/release/ — version tooling is Go-only (issues #205, #250)"
          fi

          # Docs must not instruct Node package-manager ci/link installs.
          if grep -rnE 'npm[ ](ci|link)' README.md docs --include='*.md' --exclude-dir=archive; then
            fail "Node package-manager ci/link instruction found in README/docs — Go install only (issue #205)"
          fi

          echo "single-implementation gate passed: no Node remnants found"
