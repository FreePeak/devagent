name: Release

# On merge to the default branch (push to main), compute the next semantic
# version from Conventional-Commit PR titles since the last v* tag, gate on
# Go CI, then publish a GitHub release with generated notes, the five
# cross-compiled Go binaries (issue #204) stamped with that version via
# -X internal/version.Version (issue #249), and a ledger release record
# written by the freshly built linux-amd64 binary itself.
# Version computation is the Go tool scripts/release/nextversion (issue
# #250): the Go toolchain is the only runtime this workflow needs.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Compute the next semantic version BEFORE the build (issue #249): the
  # stamp lands in every release binary via -X internal/version.Version,
  # so `devagent --version` reports the exact published tag.
  # The Go tool scripts/release/nextversion (issue #250) reads the
  # authoritative remote tag list itself; fetch-depth 0 supplies full
  # history and local tags for its fallback paths and the tag-range
  # subject log.
  semver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: next
        run: |
          OUT="$(go run ./scripts/release/nextversion)"
          echo "$OUT"
          NEXT="$(printf '%s' "$OUT" | jq -r .next)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

  # Go gate mirroring .github/workflows/ci-go.yml: the release proves Go
  # health on its own checkout regardless of CI timing on the same SHA.
  # Build + vet + test across the two unix runners.
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # FR-GO-14: windows-only files (internal/platform/listener_windows.go and
  # its test) are excluded from the unix build, so nothing above proves they
  # compile. Cross-compile + vet with GOOS=windows: vet type-checks the
  # windows test files too, which plain build does not.
  go-windows-cross:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...

  # Real windows runner, build-only (no go test): the platform package skips
  # its round-trip tests there until the FR-CTRL pipe listener lands —
  # recorded justification in docs/WINDOWS.md. Keeps CI minutes sane per
  # FR-GO-14.
  go-windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  # Issue #204: cross-compile the five release binaries. CGO off for hermetic
  # static artifacts, -trimpath for reproducible paths, -s -w to strip
  # symbol/DWARF weight — plus -X to stamp the computed version into
  # internal/version so the binary self-reports its release (issue #249).
  # Asset name: devagent-<goos>-<goarch>[.exe].
  build:
    needs: semver
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.semver.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build devagent-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/FreePeak/devagent/internal/version.Version=${TAG}" -o dist/devagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/devagent
      - name: Assert stamped version (issue #249)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          chmod +x dist/devagent-linux-amd64
          OUT="$(./dist/devagent-linux-amd64 --version)"
          echo "--version -> $OUT"
          case "$OUT" in
            *"$TAG"*) ;;
            *) echo "binary reports '$OUT', want it to contain stamped '$TAG'" >&2; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devagent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/devagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [semver, go-test, go-windows-cross, go-windows-build, go-lint, build]
    # Skip release runs themselves (tag pushes) and fork pushes.
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.semver.outputs.tag }}
        run: |
          # Idempotent guard for the tag race: if a concurrent release run
          # already created this tag (mid-race checkout computed the same
          # version), skip instead of failing HTTP 422. The next push will
          # compute a fresh version from the now-visible remote tag.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists on origin — another release run created it; skipping"
            exit 0
          fi
          # Notes are generated by GitHub from the commits in this push.
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.semver.outputs.tag }}
        run: |
          # --clobber keeps the tag-race path idempotent: two runs that both
          # computed the same version re-upload the same asset names, and
          # identical bytes make last-writer-wins harmless.
          gh release upload "$TAG" dist/devagent-* --clobber

      - name: Record release event in ledger (Go binary)
        env:
          TAG: ${{ needs.semver.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          chmod +x dist/devagent-linux-amd64
          ./dist/devagent-linux-amd64 record release --tag "$TAG" --sha "$SHA" --source release.yml
