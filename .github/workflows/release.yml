name: Release

# On merge to the default branch (push to main), compute the next semantic
# version from Conventional-Commit PR titles since the last v* tag, tag it,
# and publish a GitHub release with generated notes.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # CI gate: the release job below must not publish a tag from a commit
  # whose tests fail. Steps mirror .github/workflows/ci.yml.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  release:
    needs: [test]
    # Skip release runs themselves (tag pushes) and fork pushes.
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next semantic version
        id: semver
        run: |
          OUT="$(node scripts/release/next-version.mjs)"
          echo "$OUT"
          NEXT="$(node -e 'console.log(JSON.parse(process.argv[1]).next)' "$OUT")"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          # Idempotent guard for the tag race: if a concurrent release run
          # already created this tag (mid-race checkout computed the same
          # version), skip instead of failing HTTP 422. The next push will
          # compute a fresh version from the now-visible remote tag.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists on origin — another release run created it; skipping"
            exit 0
          fi
          # Notes are generated by GitHub from the commits in this push.
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Record release event in ledger
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          node ./dist/src/cli.js record release --tag "$TAG" --sha "$SHA" --source release.yml
