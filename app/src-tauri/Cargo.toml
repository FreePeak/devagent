[package]
name = "devagent-control"
version = "0.1.0"
description = "DevAgent Control — thin desktop client of the FR-CTRL daemon (issue #181)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
parking_lot = "0.12"
time = { version = "0.3", features = ["parsing"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "charset"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
