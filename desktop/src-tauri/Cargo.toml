[package]
name = "devagent-desktop"
version = "0.1.0"
description = "DevAgent cross-platform desktop control app (FR-UI, issue #181)"
edition = "2021"
license = "MIT"

[lib]
name = "devagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system tray on all three OSes (FR-UI-01); image-png: runtime
# tray-icon swaps for the aggregate-state indicator.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
