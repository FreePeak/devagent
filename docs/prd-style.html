<!-- DevAgent PRD custom style: include for regenerating docs/PRD.html from docs/PRD.md. Command: pandoc docs/PRD.md -f gfm -t html5 -s --toc --toc-depth=2 --metadata title="DevAgent - Product Requirements Document" -H docs/prd-style.html -o docs/PRD.html (pandoc 3.10.x). -->
    <style>
    /* DevAgent PRD styling */
    :root {
      --bg: #ffffff;
      --fg: #1a1a2e;
      --muted: #5a6478;
      --accent: #2456c7;
      --border: #dde3ee;
      --code-bg: #f4f6fa;
      --quote-bg: #f0f4ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      padding: 2.5rem 1.25rem 5rem;
      max-width: 56rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: var(--fg);
      background: var(--bg);
    }

    header#title-block-header h1.title {
      font-size: 2rem;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 0.5rem;
    }

    h1, h2, h3, h4 { line-height: 1.25; margin-top: 2rem; }

    h2 {
      font-size: 1.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      scroll-margin-top: 1rem;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    code {
      background: var(--code-bg);
      border-radius: 4px;
      padding: 0.15em 0.35em;
      font-size: 0.9em;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }

    pre code { background: none; padding: 0; }

    blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1.25rem;
      border-left: 4px solid var(--accent);
      background: var(--quote-bg);
      color: var(--muted);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.25rem 0;
      font-size: 0.92em;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.7rem;
      text-align: left;
      vertical-align: top;
    }

    th { background: var(--code-bg); }

    /* pandoc TOC */
    nav#TOC {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      background: #fafbfe;
      font-size: 0.95em;
    }

    nav#TOC > ul { padding-left: 1.2rem; }
    nav#TOC ul { list-style-type: none; }
    nav#TOC li { margin: 0.25rem 0; }
    nav#TOC::before {
      content: "Contents";
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --fg: #e4e7f0;
        --muted: #9aa4bb;
        --accent: #7ea4f5;
        --border: #2b3044;
        --code-bg: #1c2030;
        --quote-bg: #1a2138;
      }
      th { background: #1c2030; }
    }
    </style>
